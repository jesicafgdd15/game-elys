        "Tidak ada manfaatnya"
      ],
      "a": 1
    },
    "membaca-2": {
      "q": "Kamu belum suka membaca. Cara awal mana yang tepat?",
      "o": [
        "Memaksa diri membaca buku tebal yang tidak menarik",
        "Hanya membaca saat disuruh",
        "Memilih buku tentang hal yang kamu sukai"
      ],
      "a": 2
    },
    "membaca-3": {
      "q": "Target membaca mana yang paling mudah dijaga setiap hari?",
      "o": [
        "Sepuluh buku sehari",
        "Satu buku setahun sekali",
        "Sepuluh menit sehari"
      ],
      "a": 2
    },
    "membaca-4": {
      "q": "Apa yang bisa kamu lakukan setelah membaca supaya lebih ingat isinya?",
      "o": [
        "Menceritakan kembali dengan kata-katamu sendiri",
        "Langsung melupakannya",
        "Menutup buku dan tidak membahasnya"
      ],
      "a": 0
    },
    "bertanya-1": {
      "q": "Kamu belum paham penjelasan guru. Apa yang sebaiknya dilakukan?",
      "o": [
        "Diam dan berharap nanti paham sendiri",
        "Menyalin jawaban teman",
        "Mengangkat tangan dan bertanya"
      ],
      "a": 2
    },
    "bertanya-2": {
      "q": "Pertanyaan mana yang paling jelas?",
      "o": [
        "Aku belum paham langkah kedua cara membagi ini.",
        "Aku nggak ngerti semuanya.",
        "Ini susah."
      ],
      "a": 0
    },
    "bertanya-3": {
      "q": "Setelah bertanya, apa yang sebaiknya kamu lakukan?",
      "o": [
        "Mengobrol dengan teman lain",
        "Mendengarkan jawabannya dan mencatat hal pentingnya",
        "Pergi sebelum dijawab"
      ],
      "a": 1
    },
    "bertanya-4": {
      "q": "Kamu malu bertanya di kelas. Apa yang bisa kamu lakukan?",
      "o": [
        "Menahan pertanyaan selamanya",
        "Menganggap pelajaran itu tidak penting",
        "Menuliskan pertanyaannya lalu menanyakannya kepada guru"
      ],
      "a": 2
    },
    "berbagi-1": {
      "q": "Apa manfaat belajar kelompok yang baik?",
      "o": [
        "Bisa saling membantu memahami pelajaran",
        "Bisa menyalin pekerjaan satu sama lain",
        "Bisa mengobrol sepanjang waktu"
      ],
      "a": 0
    },
    "berbagi-2": {
      "q": "Cara mana yang membantumu makin paham pelajaran?",
      "o": [
        "Menghafal tanpa pernah menjelaskan",
        "Melewatkan bagian yang sulit",
        "Menjelaskannya kepada adik atau teman"
      ],
      "a": 2
    },
    "berbagi-3": {
      "q": "Temanmu bertanya hal yang menurutmu mudah. Apa yang tepat kamu lakukan?",
      "o": [
        "Menertawakannya",
        "Menjelaskan dengan sabar",
        "Pura-pura tidak mendengar"
      ],
      "a": 1
    },
    "berbagi-4": {
      "q": "Kamu baru tahu fakta menarik tentang gurita. Apa yang bisa kamu lakukan?",
      "o": [
        "Menyimpannya sendiri supaya tidak ada yang tahu",
        "Melupakannya",
        "Menceritakannya kepada teman atau keluarga"
      ],
      "a": 2
    }
  };

  var FACT_BY_ID = {};
  FACTS.forEach(function (f) { FACT_BY_ID[f.id] = f; });

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }

  /* Data tersimpan: bintang["id"] = { s: "ok" } atau { s: "miss", d: "tanggal" } */
  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(KEY));
      if (raw && typeof raw === "object" && raw.stars && typeof raw.stars === "object") return raw;
    } catch (e) {}
    return { stars: {} };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  var S = load();
  var V = { view: "start", topic: null, id: null, step: "read", why: false, order: null, picked: null, right: false, confirmReset: false };
  var focusKey = null, focusHeading = false;

  function topicFacts(t) { return FACTS.filter(function (f) { return f.t === t; }); }
  function statusOf(id) {
    var v = S.stars[id];
    if (!v) return "open";
    if (v.s === "ok") return "ok";
    return v.d === today() ? "miss" : "open";
  }
  function starsOf(t) { return topicFacts(t).filter(function (f) { return statusOf(f.id) === "ok"; }).length; }
  function totalStars() { return FACTS.filter(function (f) { return statusOf(f.id) === "ok"; }).length; }
  function unlocked(i) { return i === 0 || starsOf(ORDER[i - 1]) >= NEED; }
  function rankFor(n) { var r = RANKS[0][1]; RANKS.forEach(function (x) { if (n >= x[0]) r = x[1]; }); return r; }

  /* Peta */
  var NODES = [{ x: 100, y: 80 }, { x: 300, y: 190 }, { x: 100, y: 300 }, { x: 300, y: 410 }, { x: 100, y: 520 }, { x: 300, y: 630 }];
  function starPts(cx, cy, r) {
    var p = [];
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      p.push((cx + rr * Math.cos(a)).toFixed(1) + "," + (cy + rr * Math.sin(a)).toFixed(1));
    }
    return p.join(" ");
  }
  function renderMap() {
    var s = "";
    for (var i = 0; i < NODES.length - 1; i++) {
      var a = NODES[i], b = NODES[i + 1], ym = (a.y + b.y) / 2;
      var open = unlocked(i + 1);
      s += '<path d="M' + a.x + " " + a.y + " C" + a.x + " " + ym + " " + b.x + " " + ym + " " + b.x + " " + b.y + '" fill="none" stroke="' +
        (open ? "var(--gold)" : "var(--line)") + '" stroke-width="' + (open ? 4 : 3) + '" stroke-linecap="round"' + (open ? "" : ' stroke-dasharray="2 10"') + "/>";
    }
    ORDER.forEach(function (t, i) {
      var n = NODES[i], open = unlocked(i), got = starsOf(t), col = "var(" + TOPICS[t].c + ")";
      var label = "Pulau " + TOPICS[t].name + ", " + got + " dari 4 bintang" + (open ? "" : ", terkunci");
      s += '<g class="node' + (open ? "" : " locked") + '" data-act="island" data-t="' + t + '" role="button" tabindex="0" aria-label="' + esc(label) + '"' + (open ? "" : ' aria-disabled="true"') + ">";
      s += '<circle cx="' + n.x + '" cy="' + n.y + '" r="40" fill="' + (open ? col : "var(--sea-2)") + '" stroke="' + (open ? "var(--foam)" : "var(--line)") + '" stroke-width="3"' + (open ? "" : ' stroke-dasharray="6 6"') + "/>";
      if (open) {
        s += '<text class="num" x="' + n.x + '" y="' + (n.y + 11) + '" text-anchor="middle" font-size="32" fill="#0a1b2b">' + (i + 1) + "</text>";
      } else {
        s += '<g transform="translate(' + n.x + " " + (n.y + 2) + ')"><rect x="-10" y="-2" width="20" height="15" rx="3" fill="var(--dim)"/><path d="M-6 -2 V-8 a6 6 0 0 1 12 0 V-2" fill="none" stroke="var(--dim)" stroke-width="3"/></g>';
      }
      if (got === 4) s += '<path transform="translate(' + n.x + " " + (n.y - 52) + ')" d="M-13 0 L-9 -13 L0 -5 L9 -13 L13 0Z" fill="var(--gold)"/>';
      s += '<text x="' + n.x + '" y="' + (n.y + 64) + '" text-anchor="middle" font-size="17" font-weight="700" fill="' + (open ? "var(--foam)" : "var(--dim)") + '">' + esc(TOPICS[t].name) + "</text>";
      for (var k = 0; k < 4; k++) {
        var sx = n.x - 30 + k * 20, sy = n.y + 82;
        s += '<polygon points="' + starPts(sx, sy, 8) + '" ' + (k < got ? 'fill="var(--gold)" stroke="var(--gold)"' : 'fill="none" stroke="var(--dim)"') + ' stroke-width="1.5" stroke-linejoin="round"/>';
      }
      s += "</g>";
    });
    $("map").innerHTML = s;
    $("reset-area").innerHTML = '<button class="btn" type="button" data-act="finish" data-key="finish">Selesai</button>';
  }

  function renderHud() {
    var n = totalStars();
    $("h-stars").textContent = n + "/" + FACTS.length;
    $("h-rank").textContent = rankFor(n);
  }

  /* Layar pulau */
  function renderIsland() {
    var t = V.topic, list = topicFacts(t), got = starsOf(t), i = ORDER.indexOf(t);
    var nextName = i < ORDER.length - 1 ? TOPICS[ORDER[i + 1]].name : null;
    var h = '<div><button class="btn ghost" type="button" data-act="back-map" data-key="back-map">Kembali ke peta</button></div>' +
      '<div style="--tc:var(' + TOPICS[t].c + ')"><h2 id="view-h" tabindex="-1" style="color:var(--tc)">Pulau ' + esc(TOPICS[t].name) + "</h2>" +
      '<p class="lead">' + got + " dari 4 bintang." + (nextName ? (got >= NEED ? " Pulau " + esc(nextName) + " sudah terbuka." : " Kumpulkan " + NEED + " bintang untuk membuka Pulau " + esc(nextName) + ".") : " Ini pulau terakhir.") + "</p></div>" +
      '<ol class="pos" style="--tc:var(' + TOPICS[t].c + ')">';
    list.forEach(function (f, k) {
      var st = statusOf(f.id);
      var info = st === "ok" ? '<small class="ok">Bintang didapat</small>' : st === "miss" ? '<small class="miss">Jawabanmu belum tepat. Coba lagi besok.</small>' : "<small>Belum dijawab</small>";
      h += '<li><span class="pos-n">' + (k + 1) + '</span><div class="pos-t"><strong>' + esc(f.title) + "</strong>" + info + "</div>" +
        '<button class="btn' + (st === "open" ? "" : " ghost") + '" type="button" data-act="start" data-id="' + f.id + '" data-key="start-' + f.id + '">' + (st === "open" ? "Mulai pos" : "Baca lagi") + "</button></li>";
    });
    $("v-island").innerHTML = h + "</ol>";
  }

  /* Layar pos */
  function renderStage() {
    var f = FACT_BY_ID[V.id], t = f.t, list = topicFacts(t), idx = list.indexOf(f), st = statusOf(f.id), q = QS[f.id];
    var h = '<div><button class="btn ghost" type="button" data-act="back-island" data-key="back-island">Kembali ke pulau</button></div>' +
      '<article class="card" style="--tc:var(' + TOPICS[t].c + ')">' +
      '<p class="eyebrow">Pulau ' + esc(TOPICS[t].name) + " &middot; pos " + (idx + 1) + " dari " + list.length + "</p>";
    if (V.step === "read") {
      h += '<h3 id="view-h" tabindex="-1" class="title">' + esc(f.title) + '</h3><p class="fact-text">' + esc(f.text) + "</p>";
      if (V.why) h += '<div class="why"><strong>Kenapa begitu?</strong><p>' + esc(f.why) + "</p></div>";
      h += '<div class="btn-row"><button class="btn ghost" type="button" data-act="why" data-key="why">' + (V.why ? "Sembunyikan penjelasan" : "Kenapa begitu?") + "</button>";
      if (st === "open") h += '<button class="btn" type="button" data-act="test" data-key="test">Aku siap dites</button>';
      h += "</div>";
      if (st === "ok") h += '<p class="muted">Bintang pos ini sudah kamu dapat.</p>';
      if (st === "miss") h += '<p class="muted">Jawabanmu di pos ini belum tepat hari ini. Baca lagi baik-baik, besok kamu bisa mencoba lagi.</p>';
    } else {
      h += '<h3 id="view-h" tabindex="-1" class="title">Tes pos: ' + esc(f.title) + '</h3><p class="qtext">' + esc(q.q) + '</p><div class="opts">';
      V.order.forEach(function (oi, k) {
        var cls = "opt", mark = "";
        if (V.picked !== null) {
          if (oi === q.a) { cls += " right"; mark = " (benar)"; }
          else if (k === V.picked) { cls += " wrong"; mark = " (pilihanmu)"; }
        }
        h += '<button class="' + cls + '" type="button" data-act="answer" data-o="' + k + '" data-key="opt-' + k + '"' + (V.picked !== null ? " disabled" : "") + ">" + esc(q.o[oi] + mark) + "</button>";
      });
      h += "</div>";
      if (V.picked !== null) {
        h += '<p class="res ' + (V.right ? "ok" : "no") + '">' + (V.right ? "Tepat! +1 bintang" : "Belum tepat. Tidak ada bintang.") + "</p>" +
          '<div class="why"><strong>Kenapa begitu?</strong><p>' + esc(f.why) + "</p></div>";
        var more = idx < list.length - 1;
        h += '<div class="btn-row">' + (more ? '<button class="btn" type="button" data-act="next" data-key="next">Pos berikutnya</button>' : "") +
          '<button class="btn ' + (more ? "ghost" : "") + '" type="button" data-act="back-island" data-key="done">Kembali ke pulau</button></div>';
      }
    }
    $("v-stage").innerHTML = h + "</article>";
  }

  /* Layar awal dan layar hasil */
  function renderStart() {
    var n = totalStars(), has = Object.keys(S.stars).length > 0;
    var h = '<div class="card"><h2 id="view-h" tabindex="-1">Siap berlayar?</h2>' +
      '<p class="lead" style="margin-top:0">Baca kartu di setiap pos, lalu jawab soalnya. Bintang hanya untuk jawaban yang benar. Tekan Selesai kapan saja untuk melihat hasil pelayaranmu.</p>' +
      '<div class="btn-row"><button class="btn big" type="button" data-act="begin" data-key="begin">' + (has ? "Lanjutkan" : "Mulai") + "</button>";
    if (has && !V.confirmReset) h += '<button class="btn ghost" type="button" data-act="reset" data-key="reset">Mulai dari awal</button>';
    h += "</div>";
    if (has && V.confirmReset) h += '<p>Hapus semua bintang dan mulai dari awal? <button class="link" type="button" data-act="reset-yes" data-key="reset-yes">Ya, hapus</button> <button class="link" type="button" data-act="reset-no" data-key="reset-no">Batal</button></p>';
    if (has) h += '<p class="muted">Kamu punya ' + n + " bintang tersimpan dari pelayaran sebelumnya.</p>";
    $("v-start").innerHTML = h + "</div>";
  }
  function renderEnd() {
    var n = totalStars();
    var misses = FACTS.filter(function (f) { return statusOf(f.id) === "miss"; }).length;
    var h = '<div class="card"><p class="eyebrow">Pelayaran selesai</p><h2 id="view-h" tabindex="-1">' + esc(rankFor(n)) + "</h2>" +
      '<p class="res ok">' + n + " dari " + FACTS.length + " bintang</p><ul class=\"sum\">";
    ORDER.forEach(function (t) {
      h += '<li style="--tc:var(' + TOPICS[t].c + ')"><span>Pulau ' + esc(TOPICS[t].name) + "</span><strong>" + starsOf(t) + "/4</strong></li>";
    });
    h += "</ul>";
    if (misses) h += '<p class="muted">' + misses + " pos belum tepat hari ini. Baca lagi kartunya dan coba besok.</p>";
    h += '<div class="btn-row"><button class="btn" type="button" data-act="again" data-key="again">Main lagi</button>' +
      '<button class="btn ghost" type="button" data-act="back-map" data-key="back-map">Kembali ke peta</button></div>' +
      '<p class="muted">Main lagi menyegarkan game: semua bintang dihapus dan kamu mulai dari awal.</p></div>';
    $("v-end").innerHTML = h;
  }

  function renderAll() {
    renderHud();
    $("v-start").hidden = V.view !== "start";
    $("v-end").hidden = V.view !== "end";
    $("v-map").hidden = V.view !== "map";
    $("v-island").hidden = V.view !== "island";
    $("v-stage").hidden = V.view !== "stage";
    if (V.view === "map") renderMap();
    if (V.view === "island") renderIsland();
    if (V.view === "stage") renderStage();
    if (V.view === "start") renderStart();
    if (V.view === "end") renderEnd();
    if (focusHeading) {
      var hd = $("view-h");
      if (hd) hd.focus();
      focusHeading = false;
    } else if (focusKey) {
      var el = document.querySelector('[data-key="' + focusKey + '"]');
      if (el && !el.disabled) el.focus();
    }
    focusKey = null;
  }

  var toastTimer = 0;
  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3800);
  }
  function go(view) { V.view = view; V.confirmReset = false; focusHeading = view !== "map"; window.scrollTo(0, 0); }

  var actions = {
    island: function (b) {
      var t = b.dataset.t, i = ORDER.indexOf(t);
      if (!unlocked(i)) { toast("Pulau ini masih terkunci. Kumpulkan " + NEED + " bintang di pulau sebelumnya."); return; }
      V.topic = t; go("island");
    },
    "back-map": function () { go("map"); },
    begin: function () { go("map"); },
    finish: function () { go("end"); },
    again: function () { S = { stars: {} }; V.topic = null; V.id = null; go("start"); toast("Game disegarkan. Siap berlayar lagi!"); },
    "back-island": function () { V.topic = FACT_BY_ID[V.id] ? FACT_BY_ID[V.id].t : V.topic; go("island"); },
    start: function (b) { V.id = b.dataset.id; V.step = "read"; V.why = false; V.picked = null; go("stage"); },
    why: function () { V.why = !V.why; focusKey = "why"; },
    test: function () {
      if (statusOf(V.id) !== "open") return;
      V.step = "q"; V.order = shuffle([0, 1, 2]); V.picked = null; V.right = false; focusHeading = true;
    },
    answer: function (b) {
      if (V.picked !== null || statusOf(V.id) !== "open") return;
      var f = FACT_BY_ID[V.id], q = QS[V.id], k = +b.dataset.o;
      V.picked = k;
      V.right = V.order[k] === q.a;
      var before = starsOf(f.t);
      if (V.right) {
        S.stars[V.id] = { s: "ok" };
        toast("Tepat! Kamu dapat 1 bintang.");
        var ti = ORDER.indexOf(f.t);
        if (before < NEED && starsOf(f.t) >= NEED && ti < ORDER.length - 1) toast("Pulau " + TOPICS[ORDER[ti + 1]].name + " terbuka!");
      } else {
        S.stars[V.id] = { s: "miss", d: today() };
        toast("Belum tepat, jadi tidak ada bintang. Baca penjelasannya.");
      }
      var lst = topicFacts(f.t); focusKey = lst.indexOf(f) < lst.length - 1 ? "next" : "done";
    },
    next: function () {
      var f = FACT_BY_ID[V.id], list = topicFacts(f.t), idx = list.indexOf(f);
      if (idx < list.length - 1) { V.id = list[idx + 1].id; V.step = "read"; V.why = false; V.picked = null; focusHeading = true; window.scrollTo(0, 0); }
    },
    reset: function () { V.confirmReset = true; focusKey = "reset-yes"; },
    "reset-no": function () { V.confirmReset = false; focusKey = "reset"; },
    "reset-yes": function () { S = { stars: {} }; V.confirmReset = false; toast("Kemajuan dihapus. Selamat berlayar lagi!"); }
  };

  function handle(el) {
    var fn = actions[el.dataset.act];
    if (!fn || el.disabled) return;
    if (!focusKey) focusKey = el.dataset.key || null;
    fn(el);
    save();
    renderAll();
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (el) { focusKey = el.dataset.key || null; handle(el); }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("node")) {
      e.preventDefault();
      handle(e.target);
    }
  });

  renderAll();
})();
</script>

</body></html>
